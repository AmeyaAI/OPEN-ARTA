[pytest]
asyncio_mode = auto
testpaths = tests
# F6-6: ARTA generates analytics tests as `req_<id>_<layer>.py`. Pytest's
# default `python_files` only matches `test_*.py` / `*_test.py`, so the
# generated files were silently never collected. Add the `req_` pattern.
python_files = test_*.py *_test.py
markers =
    unit: unit tests
    integration: integration tests (require services)
    tier1: F5-7 analytics tier 1 — fast, every commit (≤30s, no LLM)
    tier2: F5-7 analytics tier 2 — PR gate (≤5min, mocked LLM)
    tier3: F5-7 analytics tier 3 — nightly (~60min, full LLM judge)
    adversarial: F5-7 analytics adversarial suite — robustness probes
