[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-arta"
version = "0.1.0"
description = "ARTA — the quality-evidence platform: requirements-grounded AI test generation, six-runtime execution, and truthful SUT-quality reporting."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "DPOD Labs Private Limited" }]
keywords = ["testing", "atdd", "playwright", "test-generation", "quality-engineering", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/AmeyaAI/OPEN-ARTA"
Documentation = "https://github.com/AmeyaAI/OPEN-ARTA/tree/main/docs"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]
