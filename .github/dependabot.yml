# Dependabot version updates (security updates are enabled repo-side).
# The pre-transfer security PRs were orphaned; this config regenerates
# bumps against current main so they run the full check gate natively.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Major frameworks need a human review, not an auto-bump
      # (the critical Next.js middleware advisory is patched within 14.2.x).
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      # Deferred majors — CI proved these break the current codebase
      # (frontend-type-check red under eslint 10 / typescript 7). Revisit
      # deliberately; minors/patches still flow.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # UI-library majors: the only frontend CI is type-check — a green tsc
      # cannot prove render-time safety, and eslint-config-next/react-dom
      # majors track the (ignored) next/react majors anyway. tailwind 4 is a
      # config migration; recharts 3 changed chart APIs. Deliberate upgrades.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: recharts
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
