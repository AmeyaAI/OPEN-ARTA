# Name-based customer scan using the DENYLIST secret. Runs ONLY in a trusted
# context (push to protected branches) — NOT on pull_request, because GitHub
# withholds secrets from fork PRs (the agnostic-guard covers PRs instead).
name: Denylist Guard
on:
  push:
    branches: [main, 'release/**']
permissions:
  contents: read          # least-privilege
jobs:
  denylist-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name-based scan (secret list, output redacted)
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          set -uo pipefail
          [ -n "${DENYLIST:-}" ] || { echo "DENYLIST secret not set — see the private sync runbook"; exit 1; }
          umask 077; printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/dl.txt"
          fail=0
          while read -r f; do
            [ -f "$f" ] || continue
            m=$(grep -nHiE -f "$RUNNER_TEMP/dl.txt" "$f" 2>/dev/null \
                 | grep -viE 'dpod-labs-private-limited|dpod labs|(api\.)?github\.com/(repos/)?gangadharneeli|gangadharneeli\.github\.io' | cut -d: -f1,2 || true)
            [ -n "$m" ] && { echo "denylist hit: $m"; fail=1; }
          done < <(git ls-files)
          rm -f "$RUNNER_TEMP/dl.txt"
          [ "$fail" = 0 ] && echo "PASS" \
            || { echo "FAIL: customer name detected (locations above; content redacted)"; exit 1; }
