# CLA gate — CLA Assistant Lite (contributor-assistant), the in-repo, no-server
# replacement for the cla-assistant.io app. Signatures live on the
# cla-signatures branch of THIS repo; GITHUB_TOKEN suffices (no PAT).
# SECURITY: runs on pull_request_target but checks out NO code (never add a
# checkout step here); the action is pinned to a commit SHA.
name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write         # the action re-triggers its own runs on recheck
  contents: write        # writes signatures to the cla-signatures branch
  pull-requests: write   # posts/updates the signing prompt comment
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/AmeyaAI/OPEN-ARTA/blob/main/docs/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot]
