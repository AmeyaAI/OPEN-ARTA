name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Unit tests
        run: python -m pytest tests/unit -q
        env:
          ARTA_TELEMETRY: "0"

  frontend-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  login-smoke:
    # Fresh Postgres (schema.sql) → ensure_bootstrap_admin() → password login
    # returns a token. Guards the seed-admin / bootstrap-create regression that
    # unit tests (mock DB) cannot see. Docker is preinstalled on the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/smoke_login.sh
        env:
          ARTA_TELEMETRY: "0"
